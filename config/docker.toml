# Millennium server configuration inside the Docker image. Everything not set here uses the
# defaults documented in config/server.toml. Environment overrides:
#   DATABASE_URL             postgres://user:pass@host:5432/db (default: the SQLite file below)
#   MILLENNIUM_PRIVATE_KEY   64 hex chars (`millennium-server --generate-key`); set it for real use
#   RUST_LOG                 log levels, e.g. info

[network]
bind = "0.0.0.0:5888"
auth_bind = "0.0.0.0:5888"
tls_dir = "/data/tls"

[database]
url = "sqlite:///data/world.db"
backup_dir = "/data/backups"
