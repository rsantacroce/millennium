# Millennium server configuration. Every key is optional; defaults are shown.

# Overrides the log level (also settable with RUST_LOG).
# log_filter = "info,lightyear=warn,sqlx=warn"

[network]
# UDP: the game itself.
bind = "0.0.0.0:5888"
# TCP: the TLS login service. Clients assume it's on the same port number as the game.
auth_bind = "0.0.0.0:5888"
# The login service's self-signed certificate is created here on first start.
tls_dir = "saves/tls"
# 64 hex chars used to sign connect tokens. Only the server needs it; keep it secret.
# Empty = all-zero development key (fine on your own machine, not for a public server).
private_key = ""
max_clients = 64

[database]
# Matches docker-compose.yml. Other options:
#   url = "sqlite://saves/server.db"   single-file save, no Docker needed
#   url = ""                           in-memory store (nothing is saved)
# The DATABASE_URL environment variable overrides this.
url = "postgres://millennium:millennium@localhost:5433/millennium"
max_connections = 5
save_interval_secs = 10.0

[chat]
# Token bucket: bursts of up to `burst` messages, refilling `per_second`.
burst = 5.0
per_second = 1.0
# This many rate-limit hits in a row trigger an automatic mute.
strikes_before_mute = 5
auto_mute_secs = 60
# Chat history sent on login.
history_global = 50
history_whispers = 50
# Whole-word, case-insensitive; simple leetspeak (d4rn) and stretched letters are caught too.
blocked_words = ["darn", "heck", "frak"]
# Account names (not character names) allowed to /mute and /unmute.
admins = ["admin"]

[world]
# Real minutes per game day (clients get this from the server when they log in).
day_minutes = 40.0
# Moves the clock this many game hours on (12 = start the server at night).
clock_shift_hours = 0.0

[cluster]
# Leave this section out to run every zone in this one process (the normal setup).
# To split the world over several servers, see config/cluster/ for a worked example.
# zones = [1, 3]                 # zones this server runs; empty = all of them
# hub = "127.0.0.1:5900"         # the world hub (`millennium-server --hub`)
# secret = "change-me"           # shared by the hub and every zone server
# name = "zone-a"                # for the hub's logs
# [[cluster.servers]]            # where the other zones run, as clients reach them
# addr = "203.0.113.7:5890"
# zones = [2, 4]

[hub]
# Only used by `millennium-server --hub`: where zone servers connect (keep it private).
# bind = "127.0.0.1:5900"
