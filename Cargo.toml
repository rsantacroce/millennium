[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shared = { path = "crates/shared" }
# Pinned: lightyear 0.30 requires Bevy 0.19 (Bevy 0.20 was released 2026-10-08).
bevy = { version = "=0.19.1", default-features = false }
lightyear = { version = "=0.30.1", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.9", default-features = false }

# Bevy is slow in debug builds; optimise dependencies but keep our code fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
