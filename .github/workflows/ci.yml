name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Bevy and lightyear are big; incremental builds don't help a fresh CI machine.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Build, clippy, tests, economy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: millennium
          POSTGRES_PASSWORD: millennium
          POSTGRES_DB: millennium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U millennium"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The store tests create a database per test on this server.
      TEST_DATABASE_URL: postgres://millennium:millennium@localhost:5432/millennium
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (audio, input, windowing)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (SQLite and Postgres stores)
        run: cargo test --workspace
      - name: Economy check (fails on money loops)
        run: cargo run -p shared --example economy > economy.txt && tail -5 economy.txt

  e2e:
    name: Crash and restore test on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: millennium
          POSTGRES_PASSWORD: millennium
          POSTGRES_DB: millennium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U millennium"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two commands: `-p server -p shared --examples` would only build the examples.
      - name: Build the server and the smoke tool
        run: |
          cargo build -p server
          cargo build -p shared --examples
      - name: Play the tutorial, kill -9, restart, restore a backup, check nothing was lost
        env:
          DATABASE_URL: postgres://millennium:millennium@localhost:5432/millennium
          # pg_dump must be at least the server's version: use the server image's own tools.
          PG_DUMP: docker run --rm --network host postgres:17 pg_dump
          PG_RESTORE: docker run -i --rm --network host postgres:17 pg_restore
          PSQL: docker run -i --rm --network host postgres:17 psql
        run: scripts/e2e.sh

  docker:
    name: Docker image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t millennium-server .
      - name: Start it (SQLite in the volume) and wait for the login port
        run: |
          docker volume create mdata
          docker run -d --name millennium -p 5888:5888/tcp -p 5888:5888/udp -v mdata:/data \
            -e MILLENNIUM_PRIVATE_KEY=$(docker run --rm --entrypoint millennium-server millennium-server --generate-key) \
            millennium-server
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/5888) 2>/dev/null; then echo "listening after ${i}s"; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' millennium)" != "true" ]; then docker logs millennium; exit 1; fi
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/5888) 2>/dev/null || { docker logs millennium; exit 1; }
      - name: The world and its first backup are in the volume
        run: |
          sleep 2
          docker logs millennium 2>&1 | tail -20
          docker logs millennium 2>&1 | grep -q "backed up to /data/backups/world-"
          ! docker logs millennium 2>&1 | grep -q "development netcode key"
          docker run --rm -v mdata:/data debian:bookworm-slim ls -la /data /data/backups
